<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Премиум — доступ</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=EB+Garamond&display=swap');
:root{
  --leather-1:#3a1f2d; --leather-2:#2a1520; --gold:#c6a15b; --gold-dim:#9a7d43;
  --paper:#f7efd9; --ink:#2b2415; --ink-soft:#5b5138; --rule:#d9c99a; --burgundy:#7a2233;
}
*{box-sizing:border-box;}
body{
  margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
  background:radial-gradient(ellipse at center, #2a2420 0%, #14110e 100%);
  font-family:'EB Garamond', serif; padding:24px 16px;
}
.card{
  width:100%; max-width:420px; background:var(--paper); border-radius:10px; padding:28px 24px;
  box-shadow:0 30px 60px rgba(0,0,0,.5); border:1px solid var(--rule);
}
h1{ font-family:'Playfair Display',serif; font-size:21px; color:var(--ink); margin:0 0 4px; }
.sub{ font-size:13.5px; color:var(--ink-soft); margin:0 0 20px; }
label{ font-size:12.5px; color:var(--ink-soft); display:block; margin:14px 0 4px; }
input{
  width:100%; border:1px solid var(--rule); border-radius:6px; padding:9px 10px;
  font-family:'EB Garamond',serif; font-size:15px; color:var(--ink); background:#fff;
}
input:focus{ outline:none; border-color:var(--gold-dim); }
button{
  margin-top:18px; width:100%; padding:11px; border:none; border-radius:6px;
  background:var(--burgundy); color:#fff; font-family:'EB Garamond',serif; font-size:15.5px; cursor:pointer;
}
button:hover{ filter:brightness(1.1); }
button:disabled{ opacity:.5; cursor:default; }
.status{ margin-top:14px; font-size:13.5px; text-align:center; min-height:18px; }
.status.ok{ color:#2f6b45; }
.status.err{ color:#b23a3a; }
.list{ margin-top:20px; padding-top:14px; border-top:1px solid var(--rule); }
.list h2{ font-size:13px; color:var(--ink-soft); margin:0 0 8px; font-weight:normal; }
.list ul{ margin:0; padding-left:18px; font-size:14px; color:var(--ink); }
.showlist{ background:none; border:none; color:var(--ink-soft); font-size:12.5px; text-decoration:underline; cursor:pointer; padding:0; margin-top:14px; }
</style>
</head>
<body>
<div class="card">
  <h1>Доступ к платному дневнику</h1>
  <p class="sub">Впиши логин человека, который оплатил на Boosty — и он сможет создать свой дневник.</p>

  <label for="secret">Секретное слово</label>
  <input type="password" id="secret" placeholder="твой секрет">

  <label for="user">Логин человека</label>
  <input type="text" id="user" autocapitalize="off" autocorrect="off" placeholder="например, anna_k">

  <button id="addBtn">Открыть доступ</button>
  <p class="status" id="status"></p>

  <button class="showlist" id="showListBtn">Показать всех, кому уже открыт доступ</button>
  <div class="list" id="listBlock" style="display:none;"></div>
</div>

<script>
const API_BASE = 'https://premium-diary-sync.zimasps.workers.dev';

const secretInput = document.getElementById('secret');
const userInput = document.getElementById('user');
const btn = document.getElementById('addBtn');
const status = document.getElementById('status');

btn.addEventListener('click', async () => {
  const secret = secretInput.value.trim();
  const user = userInput.value.trim().toLowerCase();
  status.textContent = ''; status.className = 'status';
  if (!secret) { status.textContent = 'Введи секретное слово'; status.className = 'status err'; return; }
  if (!user) { status.textContent = 'Введи логин'; status.className = 'status err'; return; }

  btn.disabled = true;
  try {
    const res = await fetch(`${API_BASE}/admin/add`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ secret, user })
    });
    const data = await res.json();
    if (data.ok) {
      status.textContent = `Готово — «${data.user}» теперь может создать дневник.`;
      status.className = 'status ok';
      userInput.value = '';
    } else if (data.error === 'wrong_secret') {
      status.textContent = 'Неверное секретное слово';
      status.className = 'status err';
    } else {
      status.textContent = 'Что-то пошло не так';
      status.className = 'status err';
    }
  } catch (e) {
    status.textContent = 'Нет связи с сервером';
    status.className = 'status err';
  }
  btn.disabled = false;
});

document.getElementById('showListBtn').addEventListener('click', async () => {
  const secret = secretInput.value.trim();
  const block = document.getElementById('listBlock');
  if (!secret) { status.textContent = 'Сначала введи секретное слово'; status.className = 'status err'; return; }
  try {
    const res = await fetch(`${API_BASE}/admin/list?secret=${encodeURIComponent(secret)}`);
    const data = await res.json();
    if (data.users) {
      block.style.display = 'block';
      block.innerHTML = `<h2>Открыт доступ (${data.users.length}):</h2><ul>${data.users.map(u=>`<li>${u}</li>`).join('') || '<li>пока никого</li>'}</ul>`;
    }
  } catch (e) {}
});
</script>
</body>
</html>
