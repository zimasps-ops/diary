<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Дело №4471</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Crimson+Pro:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0b0b0a;
    --bg-alt: #151412;
    --paper: #e9e2d0;
    --ink: #c9c2ae;
    --ink-dim: #8a8270;
    --ink-faint: #5c5648;
    --accent: #a4231e;
    --gold: #c9a24b;
    --line: rgba(233,226,208,0.14);
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0; padding:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Crimson Pro', serif;
    min-height:100vh;
    overflow-x:hidden;
  }

  .grain{
    position:fixed; inset:0; pointer-events:none; z-index:50;
    opacity:0.06; mix-blend-mode:overlay;
  }

  .vignette{
    position:fixed; inset:0; pointer-events:none; z-index:1;
    background: radial-gradient(ellipse at 50% -10%, rgba(201,162,75,0.10), transparent 55%),
                radial-gradient(ellipse at 50% 50%, transparent 40%, rgba(0,0,0,0.65) 100%);
  }
  .lamp{
    position:fixed; top:-20%; left:50%; transform:translateX(-50%);
    width:900px; height:900px; pointer-events:none; z-index:0;
    background: radial-gradient(circle, rgba(201,162,75,0.14) 0%, rgba(201,162,75,0.05) 35%, transparent 65%);
    animation: flicker 6s infinite ease-in-out;
  }
  @keyframes flicker{
    0%,100%{ opacity:1; }
    42%{ opacity:1; } 43%{ opacity:0.75; } 44%{ opacity:1; }
    71%{ opacity:0.9; } 72%{ opacity:1; }
    88%{ opacity:0.85; } 89%{ opacity:1; }
  }

  .stage{
    position:relative; z-index:2;
    min-height:100vh;
    display:flex; align-items:flex-start; justify-content:center;
    padding: 48px 20px 80px;
  }

  .dossier{
    width:100%; max-width:660px;
    background: linear-gradient(180deg, var(--bg-alt), #100f0e);
    border:1px solid var(--line);
    box-shadow: 0 40px 80px rgba(0,0,0,0.6), inset 0 0 60px rgba(0,0,0,0.4);
    position:relative;
  }
  .dossier::before{
    content:""; position:absolute; inset:0;
    border:1px solid rgba(201,162,75,0.08); margin:6px; pointer-events:none;
  }

  .case-header{
    display:flex; justify-content:space-between; align-items:baseline;
    padding:22px 28px 16px;
    border-bottom:1px solid var(--line);
    font-family:'Special Elite', monospace;
  }
  .case-number{ color:var(--paper); font-size:13px; letter-spacing:0.14em; text-transform:uppercase; }
  .case-status{
    font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:var(--accent);
    border:1px solid rgba(164,35,30,0.5); padding:3px 8px;
  }
  .case-status.closed{ color:var(--gold); border-color:rgba(201,162,75,0.5); }

  .content{ padding:30px 28px 6px; }

  .chapter-title{
    font-family:'Special Elite', monospace; font-size:12px; letter-spacing:0.2em;
    text-transform:uppercase; color:var(--gold); margin:0 0 18px; opacity:0.85;
  }

  .story-text{
    font-size:18px; line-height:1.75; color:var(--ink); margin:0 0 14px;
    animation: reveal 0.6s ease both;
  }
  @keyframes reveal{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:translateY(0); } }
  .story-text:nth-of-type(1){ animation-delay:0s; }
  .story-text:nth-of-type(2){ animation-delay:0.1s; }
  .story-text:nth-of-type(3){ animation-delay:0.2s; }
  .story-text:nth-of-type(4){ animation-delay:0.3s; }
  .story-text:nth-of-type(5){ animation-delay:0.4s; }

  .choices{ list-style:none; margin:8px 0 8px; padding:0; display:flex; flex-direction:column; gap:2px; }
  .choice-btn{
    all:unset; cursor:pointer; display:flex; gap:12px; align-items:baseline;
    padding:14px 10px; font-family:'Crimson Pro', serif; font-size:17px; color:var(--paper);
    border-bottom:1px solid transparent; transition: border-color 0.2s ease, padding-left 0.2s ease, color 0.2s ease;
    width:100%;
  }
  .choice-btn:hover, .choice-btn:focus-visible{ border-bottom-color: var(--gold); padding-left:18px; color:var(--gold); }
  .choice-btn:focus-visible{ outline:1px solid var(--gold); outline-offset:2px; }
  .choice-btn.done{ color:var(--ink-faint); cursor:default; }
  .choice-btn.done:hover{ border-bottom-color:transparent; padding-left:10px; color:var(--ink-faint); }
  .choice-arrow{ font-family:'JetBrains Mono', monospace; color:var(--accent); flex-shrink:0; }
  .choice-btn.done .choice-arrow{ color:var(--ink-faint); }
  .choice-sub{ display:block; font-size:12px; color:var(--ink-dim); margin-top:3px; font-family:'JetBrains Mono', monospace; letter-spacing:0.03em; }

  .ending-block{ margin-top:8px; padding:18px 16px; background:rgba(0,0,0,0.25); border-left:2px solid var(--accent); }
  .ending-block.good{ border-left-color: var(--gold); }
  .ending-label{ font-family:'Special Elite', monospace; font-size:12px; letter-spacing:0.15em; text-transform:uppercase; color:var(--accent); margin:0 0 10px; }
  .ending-label.good{ color: var(--gold); }

  .restart-btn{
    all:unset; cursor:pointer; margin-top:20px; display:inline-block;
    font-family:'Special Elite', monospace; font-size:12px; letter-spacing:0.12em; text-transform:uppercase;
    color:var(--ink-dim); border:1px solid var(--line); padding:10px 16px;
    transition: color 0.2s ease, border-color 0.2s ease;
  }
  .restart-btn:hover{ color:var(--paper); border-color:var(--gold); }

  .dossier-tracker{
    padding:16px 28px 22px; border-top:1px solid var(--line);
  }
  .tracker-label{
    font-family:'Special Elite', monospace; font-size:10px; letter-spacing:0.18em; text-transform:uppercase;
    color:var(--ink-faint); margin:0 0 10px;
  }
  .tracker-grid{ display:flex; flex-wrap:wrap; gap:8px 14px; }
  .tracker-item{
    font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:0.02em;
    color:var(--ink-faint); display:flex; align-items:center; gap:6px;
  }
  .tracker-item.got{ color:var(--paper); }
  .tracker-dot{ width:6px; height:6px; border-radius:50%; background:var(--ink-faint); flex-shrink:0; }
  .tracker-item.got .tracker-dot{ background:var(--gold); box-shadow:0 0 6px rgba(201,162,75,0.6); }

  @media (max-width:520px){
    .story-text{ font-size:16.5px; }
    .content{ padding:24px 20px 4px; }
    .case-header{ padding:18px 20px 14px; }
    .dossier-tracker{ padding:14px 20px 20px; }
  }
  @media (prefers-reduced-motion: reduce){ .lamp{ animation:none; } .story-text{ animation:none; } }
</style>
</head>
<body>

<svg class="grain" xmlns="http://www.w3.org/2000/svg">
  <filter id="noiseFilter">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter>
  <rect width="100%" height="100%" filter="url(#noiseFilter)"/>
</svg>
<div class="lamp"></div>
<div class="vignette"></div>

<div class="stage">
  <div class="dossier">
    <div class="case-header">
      <span class="case-number">Дело № 4471 — «Синий фазан»</span>
      <span class="case-status" id="statusTag">в работе</span>
    </div>
    <div class="content" id="content"></div>
    <div class="dossier-tracker" id="tracker"></div>
  </div>
</div>

<script>
/* ---------- state ---------- */
let visited = { apartment:false, club:false, pawnshop:false, lawyer:false };
let clues = { ledger:false, neighborIntel:false, affairClue:false, blackmailClue:false, insuranceProof:false };
let flags = { entryToken:false, riskyFlag:false, reputationRisky:false };

const CLUE_LABELS = {
  ledger: "Гроссбух: Ковач и Дреков",
  neighborIntel: "Мотив: страх перед сестрой",
  affairClue: "Роман с Дрековым",
  blackmailClue: "Компромат — фотографии",
  insuranceProof: "Страховой полис на Марту"
};

function clueCount(){ return Object.values(clues).filter(Boolean).length; }

/* ---------- static story text ---------- */
const TEXT = {
  start: [
    "Дождь третий день долбит по жестяному карнизу. Ты приходишь в контору к семи — сигарета ещё не докурена, кофе ещё не остыл. Свет фонаря дрожит за окном.",
    "Стук в дверь. Женщина в мокром пальто садится, не дожидаясь приглашения.",
    "«Мою сестру, Ирину, никто не видел три дня. Последний раз её видели в „Синем фазане“, с человеком по фамилии Штейн», — она кладёт на стол ключ и конверт с деньгами. Больше ничего не говорит.",
    "Ты открываешь новую папку. Дело только начинается — и от того, куда ты пойдёшь сначала, будет зависеть, что ты успеешь узнать."
  ],
  apartment_intro: [
    "Квартира Ирины пахнет чужим одеколоном — не тем, что она сама предпочитала. У шкафа брошены туфли, будто она выбегала босиком.",
    "На столе — фотография, разорванная пополам: лицо мужчины оторвано начисто. На обороте адрес: склад №9, портовая набережная.",
    "Можно обыскать письменный стол. Или дождаться соседку — из-за стены слышно радио."
  ],
  apartment_desk: [
    "Нижний ящик заперт — но не для того, кто носит отмычку размером с зубочистку. Внутри приходно-расходная книга: цифры, даты, и два имени, которые повторяются чаще прочих — Ковач и Дреков.",
    "Ковач — ростовщик, чьё имя на этой улице уже слышали не раз. Дреков — новое. Судя по суммам, Ирина не занимала деньги. Она их кому-то передавала."
  ],
  apartment_neighbor: [
    "Дверь приоткрывается на цепочку. Пахнет луком и страхом.",
    "«Штейн — не человек, а функция. Работает на того, кто ссужает деньги под процент, после которого должники продают собственные тени. Ирина задолжала. Крупно», — соседка понижает голос.",
    "«Но испугана она была не Штейна. Она боялась, что об этом узнает сестра»."
  ],
  club_intro: [
    "«Синий фазан» дышит сигаретным дымом и саксофоном не в такт. За стойкой — бармен, у двери — швейцар, оба выглядят так, будто ничего не видели и не увидят.",
    "Можно подкупить швейцара — он не откажется от лишней купюры. Или разговорить бармена: за стойкой обычно знают больше, чем говорят вслух."
  ],
  club_doorman: [
    "Купюра меняет выражение его лица быстрее, чем зажигается спичка.",
    "«Штейн заходит на склад через боковую дверь — там, где грузят ящики», — он суёт тебе картонный жетон. Номер девять. — «Открывает замок, если знать, куда его вставить»."
  ],
  club_bartender: [
    "Бармен протирает стакан, который и так чист, но говорит охотнее, чем швейцар.",
    "«Штейн уводил отсюда рыжую в зелёном платье — не сопротивлялась. А вон тот, за роялем, недавно узнал на фотографии, которую ему кто-то показывал, лицо завсегдатая. Дреков. Совладелец заведения — тихий, без вывески».",
    "Пианист, не отрывая рук от клавиш, добавляет: «Поговаривают, у Дрекова был роман с девушкой вроде вашей пропавшей. Он умеет быть тихим, когда нужно»."
  ],
  pawnshop_intro: [
    "Ломбард «Огонёк» пахнет пылью и чужими надеждами. Хозяин листает гроссбух, не поднимая глаз.",
    "«Рыжая? Заходила. Сдала кольцо — дорогое, обручальное, но не своё, судя по гравировке. Спешила, будто за ней шли».",
    "Он выжидающе смотрит на тебя — разговор можно продолжить деньгами. Или чем-то убедительнее."
  ],
  pawnshop_pay: [
    "Купюра ложится на стекло витрины. Хозяин придвигает к тебе конверт.",
    "«Кольцо было не единственным. Были и фотографии — она хотела, чтобы я их припрятал. Сказала: если что-то со мной случится, пусть это увидят все». Он не уточняет, что на фотографиях. Ты понимаешь и без него — это чей-то роман, снятый не для семейного альбома."
  ],
  pawnshop_threat: [
    "Ты облокачиваешься на витрину так, что стекло похрустывает под весом разговора. Хозяин быстро находит недостающую вежливость.",
    "«Хорошо, хорошо — были фотографии. Она хотела, чтобы я их припрятал, на случай если с ней что-то случится. Судя по тому, что на них, — не она должна была бояться огласки»."
  ],
  lawyer_intro: [
    "Контора Дрекова закрыта для посетителей после шести, но свет в окне горит и в девять.",
    "Можно записаться на приём под благовидным предлогом — и подождать до утра. Или воспользоваться тем, что после дождя ржавый шпингалет на окне первого этажа держится на честном слове."
  ],
  lawyer_break: [
    "Шпингалет поддаётся быстрее, чем твоя совесть. В картотеке — папка с грифом, которого там быть не должно: страховой полис на имя Ирины, оформленный три месяца назад. Выгодоприобретатель — Марта.",
    "Сумма такая, что вопрос «зачем» отпадает сам собой."
  ],
  lawyer_appointment: [
    "Утренний приём обходится тебе в вымышленное имя и час ожидания в кресле, обитом кожей дороже твоей машины. Секретарша, уверенная, что помогает клиенту, а не расследованию, даёт заглянуть в архив «по ошибке».",
    "Страховой полис на имя Ирины. Оформлен три месяца назад. Выгодоприобретатель — Марта."
  ]
};

const ENDINGS = {
  ending_master: {
    label: "Дело закрыто полностью",
    type: "good",
    text: [
      "Ты выкладываешь всё разом — гроссбух, полис, фотографии, слова соседки о страхе Ирины. Штейн даже не пытается спорить: он всего лишь инструмент, а инструменты не умирают за хозяев.",
      "Картина складывается целиком. Марта и Дреков — не просто адвокат и клиентка, а любовники. Полис на сестру, долги Ковачу как повод для инсценировки похищения, компромат как страховка друг против друга на случай, если кто-то струсит.",
      "Ирину находят в тот же вечер — напуганную, но невредимую: она сама сбежала, узнав о полисе, и пряталась у пианиста из «Синего фазана». Марту и Дрекова берут на рассвете. Дело закрыто — по-настоящему, без недосказанностей."
    ]
  },
  ending_good: {
    label: "Дело закрыто",
    type: "good",
    text: [
      "Улик хватает, чтобы Штейн понял: молчать дальше невыгодно. Он не знает всего, но называет достаточно, чтобы протянуть нить к Дрекову и полису на имя Марты.",
      "Ирину находят — живую, испуганную, готовую наконец говорить. Марту берут за организацию, Дрекова — как соучастника. Один узел так и остаётся неразвязанным: было ли между ними что-то большее, чем сделка. Но это уже вопрос не для протокола."
    ]
  },
  ending_neutral: {
    label: "Дело закрыто не до конца",
    type: "neutral",
    text: [
      "Штейн уходит через боковую дверь раньше, чем ты успеваешь понять, кто прятался в тени. Ирину ты находишь — живую, но напуганную настолько, что не называет ни одного имени.",
      "Формально дело закрыто. Но у тебя остаётся ощущение, что настоящий заказчик по-прежнему сидит в тёплом кабинете и подписывает документы — просто теперь чужие."
    ]
  },
  ending_bad: {
    label: "Дело заведено на тебя",
    type: "bad",
    text: [
      "Ты бросаешься вперёд — и темнота бьёт первой. Когда сознание возвращается, склад пуст, а у входа уже стоят двое в форме с вопросами, на которые у тебя нет ответов.",
      "Тебя видели на месте пропажи человека, которого теперь тоже никто не может найти. Дело только начинается — но фигурантом в нём стал ты."
    ]
  }
};

/* ---------- render helpers ---------- */
function el(tag, cls, html){ const e = document.createElement(tag); if(cls) e.className = cls; if(html!==undefined) e.innerHTML = html; return e; }

function paragraphs(container, arr){
  arr.forEach(p => container.appendChild(el('p','story-text',p)));
}

function renderTracker(){
  const t = document.getElementById('tracker');
  t.innerHTML = '';
  t.appendChild(el('p','tracker-label','Материалы дела'));
  const grid = el('div','tracker-grid');
  Object.keys(CLUE_LABELS).forEach(k=>{
    const got = clues[k];
    const item = el('div','tracker-item'+(got?' got':''));
    item.appendChild(el('span','tracker-dot'));
    item.appendChild(document.createTextNode(got ? CLUE_LABELS[k] : '???'));
    grid.appendChild(item);
  });
  t.appendChild(grid);
}

function choiceBtn(label, onClick, sub){
  const li = el('li');
  const btn = el('button','choice-btn');
  btn.innerHTML = '<span class="choice-arrow">→</span><span>'+label+(sub?'<span class="choice-sub">'+sub+'</span>':'')+'</span>';
  btn.onclick = onClick;
  li.appendChild(btn);
  return li;
}

/* ---------- node renderers ---------- */
function renderStart(){
  const c = document.getElementById('content'); c.innerHTML='';
  c.appendChild(el('p','chapter-title','Вызов'));
  paragraphs(c, TEXT.start);
  const list = el('ul','choices');
  list.appendChild(choiceBtn('Открыть дело', ()=>renderHub()));
  c.appendChild(list);
  renderTracker();
  scrollTop();
}

function renderHub(){
  const c = document.getElementById('content'); c.innerHTML='';
  c.appendChild(el('p','chapter-title','Контора — куда дальше'));
  const intro = visited.apartment || visited.club
    ? "Дождь не думает останавливаться. Ты раскладываешь на столе то, что уже успел узнать, и решаешь, куда двигаться дальше."
    : "Дождь стучит по жестяному карнизу. Дело только открыто — решай, с чего начать.";
  c.appendChild(el('p','story-text',intro));

  const list = el('ul','choices');

  if(!visited.apartment){
    list.appendChild(choiceBtn('Квартира Ирины', ()=>renderApartment()));
  } else {
    list.appendChild(doneItem('Квартира Ирины — осмотрена'));
  }

  if(!visited.club){
    list.appendChild(choiceBtn('«Синий фазан»', ()=>renderClub()));
  } else {
    list.appendChild(doneItem('«Синий фазан» — пройдено'));
  }

  if(visited.pawnshop){
    list.appendChild(doneItem('Ломбард «Огонёк» — пройден'));
  } else if(visited.apartment || visited.club){
    list.appendChild(choiceBtn('Ломбард «Огонёк»', ()=>renderPawnshop(), 'наводка из первого визита'));
  }

  if(visited.lawyer){
    list.appendChild(doneItem('Контора Дрекова — пройдена'));
  } else if(clues.ledger || clues.blackmailClue){
    list.appendChild(choiceBtn('Контора Дрекова', ()=>renderLawyer(), 'имя всплывало не раз'));
  }

  list.appendChild(choiceBtn('Ехать в порт — заканчивать дело', ()=>renderDockIntro(), clueCount()<2 ? 'улик пока немного' : undefined));

  c.appendChild(list);
  renderTracker();
  scrollTop();
}

function doneItem(label){
  const li = el('li');
  const btn = el('button','choice-btn done');
  btn.disabled = true;
  btn.innerHTML = '<span class="choice-arrow">·</span><span>'+label+'</span>';
  li.appendChild(btn);
  return li;
}

function backToHubBtn(list){
  list.appendChild(choiceBtn('Вернуться в контору', ()=>renderHub()));
}

function renderApartment(){
  const c = document.getElementById('content'); c.innerHTML='';

function renderDockIntro(){
  const c = document.getElementById('content'); c.innerHTML='';
  c.appendChild(el('p','chapter-title','Склад №9'));
  const lines = ["Дождь не думает останавливаться. Ты едешь в порт — дальше можно только вперёд."];
  if(flags.entryToken){
    lines.push("Жетон подходит к висячему замку бокового входа — Штейн, похоже, хранит там не только пальто. Ты входишь тихо.");
  } else if(clues.neighborIntel){
    lines.push("Ты обходишь склад со стороны воды, там, где решётка ржавчиной проела себе лаз.");
  } else {
    lines.push("Дверь склада поддаётся без сопротивления — слишком просто для места, где прячут концы. У тебя нет плана, и это чувствуется.");
  }
  if(flags.riskyFlag){
    lines.push("Ты вспоминаешь, что несколько часов назад стоял в чужом кабинете с чужими документами в кармане. Будем надеяться, что это не аукнется именно сейчас.");
  }
  lines.push("Внутри — свет одной лампы и голоса.");
  paragraphs(c, lines);
  const list = el('ul','choices');
  list.appendChild(choiceBtn('Войти', ()=>renderConfrontation()));
  c.appendChild(list);
  renderTracker(); scrollTop();
}

function renderConfrontation(){
  const c = document.getElementById('content'); c.innerHTML='';
  c.appendChild(el('p','chapter-title','Развязка'));

  const cc = clueCount();
  const lines = [
    "Штейн сидит за ящиком, как за столом переговоров. Рядом — женская фигура, лицо в тени.",
  ];

  if(cc === 0){
    lines.push("У тебя нет ничего, кроме адреса на обороте фотографии и дурного предчувствия. Штейн явно чувствует это тоже.");
  } else {
    lines.push("Ты быстро перебираешь в памяти всё, что успел собрать за этот вечер, — и по лицу Штейна видно, что он тоже это чувствует.");
  }

  if(clues.insuranceProof){
    lines.push("«Записка, деньги, ключ… она хорошо всё продумала. Даже вас наняла для достоверности», — говорит Штейн, не удивляясь твоему приходу.");
  }
  if(clues.neighborIntel){
    lines.push("Ты вспоминаешь слова соседки: испугана Ирина была не тебя. Испугана она была сестры.");
  }
  if(clues.affairClue){
    lines.push("Роман Дрекова с кем-то, похожим на Ирину, внезапно перестаёт быть слухом и превращается в мотив.");
  }
  if(clues.blackmailClue){
    lines.push("Ты думаешь о фотографиях в ломбарде — страховке Ирины на случай, если её попытаются убрать окончательно.");
  }
  if(clues.ledger){
    lines.push("Цифры из гроссбуха — Ковач, Дреков — наконец складываются в понятную схему, а не просто в список фамилий.");
  }

  paragraphs(c, lines);

  const list = el('ul','choices');

  if(cc >= 4){
    list.appendChild(choiceBtn('Выложить всё разом и назвать имена прямо', ()=>renderEnding('ending_master')));
    list.appendChild(choiceBtn('Придержать часть улик, заставить его заговорить первым', ()=>renderEnding('ending_good')));
  } else if(cc >= 2){
    list.appendChild(choiceBtn('Блефовать, что улик больше, чем есть на самом деле', ()=>renderEnding('ending_good')));
    list.appendChild(choiceBtn('Потребовать разговора без прямых обвинений', ()=>renderEnding('ending_neutral')));
  } else {
    list.appendChild(choiceBtn('Идти напролом', ()=>renderEnding('ending_bad')));
    list.appendChild(choiceBtn('Отступить к двери и потребовать объяснений оттуда', ()=>renderEnding('ending_neutral')));
  }

  c.appendChild(list);
  renderTracker(); scrollTop();
}

function renderEnding(key){
  const ending = ENDINGS[key];
  const c = document.getElementById('content'); c.innerHTML='';
  c.appendChild(el('p','chapter-title','Развязка'));
  paragraphs(c, ending.text);

  document.getElementById('statusTag').textContent = 'закрыто';
  document.getElementById('statusTag').classList.add('closed');

  const block = el('div','ending-block'+(ending.type==='good'?' good':''));
  block.appendChild(el('p','ending-label'+(ending.type==='good'?' good':''), ending.label));
  c.appendChild(block);

  const restart = el('button','restart-btn','Начать новое дело');
  restart.onclick = ()=>{
    visited = { apartment:false, club:false, pawnshop:false, lawyer:false };
    clues = { ledger:false, neighborIntel:false, affairClue:false, blackmailClue:false, insuranceProof:false };
    flags = { entryToken:false, riskyFlag:false, reputationRisky:false };
    document.getElementById('statusTag').textContent = 'в работе';
    document.getElementById('statusTag').classList.remove('closed');
    renderStart();
  };
  c.appendChild(restart);

  renderTracker(); scrollTop();
}

function scrollTop(){ window.scrollTo({ top:0, behavior:'smooth' }); }

renderStart();
</script>
