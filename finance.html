<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Финансы</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Caveat:wght@500;600&family=EB+Garamond:ital@0;1&display=swap');

:root{
  --leather-1:#0f2d24;
  --leather-2:#0a1f19;
  --gold:#c6a15b;
  --gold-dim:#9a7d43;
  --paper:#f7efd9;
  --ink:#2b2415;
  --ink-soft:#5b5138;
  --rule:#d9c99a;
  --burgundy:#7a2233;
  --green:#2f6b45;
}
*{box-sizing:border-box;}
body{
  margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
  background:radial-gradient(ellipse at center, #2a2420 0%, #14110e 100%);
  font-family:'EB Garamond', serif; padding:24px 12px;
}
.stage{ perspective:2400px; width:100%; max-width:920px; }
.scene{ position:relative; width:100%; min-height:70vh; }

.book-closed{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  transition:opacity .5s ease .3s, transform .5s ease .3s;
}
.book-closed.hidden{ opacity:0; pointer-events:none; transform:scale(.92); position:absolute; }

.cover{
  position:relative; width:min(58%,340px); aspect-ratio:3/4;
  border-radius:4px 10px 10px 4px;
  background:linear-gradient(135deg, var(--leather-1), var(--leather-2));
  box-shadow:0 30px 60px rgba(0,0,0,.55), inset -8px 0 20px rgba(0,0,0,.4), inset 0 0 0 1px rgba(198,161,91,.15);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:24px; cursor:pointer; overflow:hidden;
}
.cover::before{
  content:''; position:absolute; inset:14px;
  border:1px solid rgba(198,161,91,.35); border-radius:2px 7px 7px 2px; pointer-events:none;
}
.cover-mark{
  width:52px; height:52px; border:1.5px solid var(--gold-dim); border-radius:50%;
  display:flex; align-items:center; justify-content:center; color:var(--gold);
  font-family:'Playfair Display',serif; font-size:22px; margin-bottom:18px;
}
.cover-title{
  font-family:'Playfair Display', serif; font-weight:700; font-size:clamp(24px,4vw,34px);
  color:var(--gold); letter-spacing:2px; margin:0; text-align:center;
}
.cover-sub{ font-family:'Caveat', cursive; color:var(--gold-dim); font-size:17px; margin:10px 0 0; text-align:center; }

.pin-panel{ margin-top:22px; width:100%; display:flex; flex-direction:column; align-items:center; gap:10px; }
.pin-input{
  width:75%; text-align:center; font-size:16px;
  background:rgba(247,239,217,.08); border:1px solid var(--gold-dim); color:var(--paper);
  border-radius:6px; padding:8px 10px; font-family:'EB Garamond',serif;
}
.pin-input:focus{ outline:none; border-color:var(--gold); }
.pin-btn{
  background:transparent; border:1px solid var(--gold); color:var(--gold);
  padding:7px 18px; border-radius:5px; font-family:'EB Garamond',serif; font-size:14.5px; cursor:pointer;
}
.pin-btn:hover{ background:rgba(198,161,91,.12); }
.pin-error{ color:#e08a8a; font-size:13px; min-height:16px; text-align:center; }
.pin-hint{ color:var(--gold-dim); font-size:12.5px; opacity:.85; text-align:center; max-width:85%; }
.pin-link{ background:none; border:none; color:var(--gold-dim); font-size:12.5px; text-decoration:underline; cursor:pointer; margin-top:4px; }

.book-open{
  position:absolute; inset:0; display:flex; opacity:0; transform:scale(.96);
  pointer-events:none; transition:opacity .5s ease .3s, transform .5s ease .3s;
}
.book-open.visible{ opacity:1; transform:scale(1); pointer-events:auto; }
.spread{
  position:relative; width:100%; display:flex; border-radius:6px; overflow:hidden;
  box-shadow:0 30px 70px rgba(0,0,0,.55); background:var(--leather-2); padding:14px; gap:2px;
}
.page{
  position:relative; flex:1;
  background:repeating-linear-gradient(transparent, transparent 27px, var(--rule) 28px), var(--paper);
  background-position:0 46px; padding:26px 22px 20px; overflow-y:auto; min-height:0; max-height:78vh;
}
.page-left{ border-radius:3px 0 0 3px; box-shadow:inset -14px 0 24px -14px rgba(0,0,0,.35); }
.page-right{ border-radius:0 3px 3px 0; box-shadow:inset 14px 0 24px -14px rgba(0,0,0,.35); }
.spine-shadow{
  position:absolute; top:14px; bottom:14px; left:50%; width:26px; transform:translateX(-50%);
  background:linear-gradient(90deg, rgba(0,0,0,.18), rgba(0,0,0,0) 40%, rgba(0,0,0,0) 60%, rgba(0,0,0,.18));
  pointer-events:none; z-index:3;
}
.close-tab{
  position:absolute; top:-2px; right:26px; background:var(--burgundy); color:var(--paper);
  font-family:'Caveat',cursive; font-size:15px; padding:6px 14px 8px; border-radius:0 0 6px 6px;
  cursor:pointer; box-shadow:0 3px 6px rgba(0,0,0,.3); z-index:5; border:none;
}
.close-tab:hover{ filter:brightness(1.1); }

.left-tabs{ display:flex; gap:6px; margin-bottom:10px; }
.left-tab{
  background:transparent; border:1px solid var(--rule); color:var(--ink-soft);
  font-family:'EB Garamond',serif; font-size:12.5px; padding:5px 10px; border-radius:4px 4px 0 0; cursor:pointer;
}
.left-tab.active{ background:rgba(122,34,51,.1); border-color:var(--burgundy); color:var(--burgundy); }

.index-head{ font-family:'Playfair Display',serif; font-size:19px; color:var(--ink); margin:0 0 4px; }
.index-rule{ border:none; border-top:1px solid var(--rule); margin:8px 0 14px; }

.month-nav{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
.month-label{ font-family:'Playfair Display',serif; font-size:17px; color:var(--ink); text-transform:capitalize; }
.month-arrow{ background:none; border:none; color:var(--gold-dim); font-size:20px; cursor:pointer; padding:2px 10px; }
.month-arrow:hover{ color:var(--burgundy); }

.summary-card{
  display:flex; justify-content:space-between; gap:8px; border:1px solid var(--rule); border-radius:6px;
  padding:10px 12px; margin-bottom:14px; background:rgba(255,255,255,.35);
}
.summary-item{ text-align:center; flex:1; }
.summary-label{ font-size:11px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.4px; }
.summary-value{ font-family:'Playfair Display',serif; font-size:16px; margin-top:2px; }
.summary-value.income{ color:var(--green); }
.summary-value.expense{ color:var(--burgundy); }

.tx-item{
  display:flex; justify-content:space-between; align-items:flex-start; gap:8px;
  padding:8px 4px; border-bottom:1px solid var(--rule); cursor:pointer;
}
.tx-item:hover{ background:rgba(122,34,51,.05); }
.tx-left{ min-width:0; }
.tx-cat{ font-size:14.5px; color:var(--ink); font-weight:600; }
.tx-note{ font-size:12.5px; font-style:italic; color:var(--ink-soft); }
.tx-date{ font-size:11.5px; color:var(--ink-soft); }
.tx-amount{ font-family:'Playfair Display',serif; font-size:15px; white-space:nowrap; }
.tx-amount.income{ color:var(--green); }
.tx-amount.expense{ color:var(--burgundy); }
.empty-index{ color:var(--ink-soft); font-style:italic; font-size:14.5px; opacity:.75; }

.new-entry-btn{
  margin-top:14px; width:100%; background:transparent; border:1px solid var(--burgundy); color:var(--burgundy);
  font-family:'EB Garamond',serif; font-size:14.5px; padding:8px 10px; border-radius:4px; cursor:pointer;
}
.new-entry-btn:hover{ background:rgba(122,34,51,.08); }

.cat-row{ display:flex; align-items:center; gap:8px; margin-bottom:10px; }
.cat-name{ width:110px; font-size:13.5px; color:var(--ink); flex-shrink:0; }
.cat-bar-track{ flex:1; height:10px; background:rgba(0,0,0,.06); border-radius:6px; overflow:hidden; }
.cat-bar-fill{ height:100%; background:var(--burgundy); border-radius:6px; }
.cat-amount{ width:70px; text-align:right; font-size:13px; color:var(--ink-soft); flex-shrink:0; }

.side-links{ margin-top:18px; padding-top:12px; border-top:1px solid var(--rule); display:flex; flex-direction:column; gap:6px; }
.side-link{ background:none; border:none; color:var(--ink-soft); font-size:12.5px; text-decoration:underline; cursor:pointer; text-align:left; padding:0; }
.storage-note{ color:var(--ink-soft); font-size:11.5px; opacity:.75; margin-top:18px; line-height:1.4; }

.rpage-inner{ display:flex; flex-direction:column; min-height:100%; }
.rtitle{ font-family:'Playfair Display',serif; font-size:18px; color:var(--ink); margin:0 0 14px; }
.type-toggle{ display:flex; gap:8px; margin-bottom:14px; }
.type-btn{
  flex:1; padding:8px; border-radius:5px; border:1px solid var(--rule); background:transparent;
  font-family:'EB Garamond',serif; font-size:14px; cursor:pointer; color:var(--ink-soft);
}
.type-btn.active.expense{ background:rgba(122,34,51,.12); border-color:var(--burgundy); color:var(--burgundy); }
.type-btn.active.income{ background:rgba(47,107,69,.12); border-color:var(--green); color:var(--green); }

.field-label{ font-size:12.5px; color:var(--ink-soft); margin:10px 0 3px; }
.field-input{
  width:100%; border:1px solid var(--rule); border-radius:5px; padding:7px 9px;
  font-family:'EB Garamond',serif; font-size:14.5px; color:var(--ink); background:rgba(255,255,255,.5);
}
.field-input:focus{ outline:none; border-color:var(--gold-dim); }
.rpage-actions{ display:flex; gap:10px; margin-top:16px; flex-wrap:wrap; }
.act-btn{
  background:transparent; border:1px solid var(--gold-dim); color:var(--ink-soft);
  font-family:'EB Garamond',serif; font-size:13.5px; padding:6px 12px; border-radius:4px; cursor:pointer;
}
.act-btn.primary{ border-color:var(--burgundy); color:var(--burgundy); }
.act-btn:hover{ background:rgba(0,0,0,.04); }
.help-text{ font-size:14px; line-height:1.55; color:var(--ink-soft); }
.help-text p{ margin:0 0 12px; }
.help-text strong{ color:var(--ink); }

@media (max-width:640px){
  .spread{ padding:8px; gap:1px; }
  .page{ padding:14px 12px 14px; font-size:13px; }
  .spine-shadow{ width:14px; }
  .cover-title{ font-size:22px; }
}
</style>
</head>
<body>

<div class="stage">
  <div class="scene">
    <div class="book-closed" id="bookClosed">
      <div class="cover" id="coverClick">
        <div class="cover-mark">₽</div>
        <h1 class="cover-title">Финансы</h1>
        <p class="cover-sub" id="coverSub">доходы и расходы</p>
        <div class="pin-panel" id="pinPanel" style="display:none;"></div>
      </div>
    </div>
    <div class="book-open" id="bookOpen">
      <div class="spread" id="spread">
        <button class="close-tab" id="closeTab">закрыть</button>
        <div class="page page-left" id="pageLeft"></div>
        <div class="spine-shadow"></div>
        <div class="page page-right" id="pageRight"></div>
      </div>
    </div>
  </div>
</div>

<script>
const bookClosed = document.getElementById('bookClosed');
const bookOpen = document.getElementById('bookOpen');
const closeTab = document.getElementById('closeTab');
const pageLeft = document.getElementById('pageLeft');
const pageRight = document.getElementById('pageRight');
const spread = document.getElementById('spread');
const coverClick = document.getElementById('coverClick');
const coverSub = document.getElementById('coverSub');
const pinPanel = document.getElementById('pinPanel');

const API_BASE = 'https://finance-sync.zimasps.workers.dev';

let cryptoKey = null;
let transactions = [];
let currentUsername = '';
let currentSalt = null;
let leftTab = 'list';
let monthOffset = 0;
let editingId = null;
let formType = 'expense';

const EXPENSE_CATS = ['Еда','Транспорт','Жильё','Развлечения','Здоровье','Одежда','Подарки','Обучение','Прочее'];
const INCOME_CATS = ['Зарплата','Подработка','Подарки','Прочее'];

function uid(){ return 't' + Date.now() + Math.random().toString(36).slice(2,7); }
function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function fmtMoney(n){
  return new Intl.NumberFormat('ru-RU').format(n) + ' ₽';
}

function b64FromBytes(bytes){
  let bin=''; const arr=new Uint8Array(bytes);
  for(let i=0;i<arr.length;i++) bin += String.fromCharCode(arr[i]);
  return btoa(bin);
}
function bytesFromB64(b64){
  const bin=atob(b64); const bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  return bytes;
}
async function deriveKey(pin, saltBytes){
  const enc = new TextEncoder();
  const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(pin), {name:'PBKDF2'}, false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name:'PBKDF2', salt: saltBytes, iterations: 150000, hash:'SHA-256' },
    keyMaterial, { name:'AES-GCM', length:256 }, false, ['encrypt','decrypt']
  );
}
async function encryptJSON(key, obj){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const data = new TextEncoder().encode(JSON.stringify(obj));
  const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, data);
  return { iv: b64FromBytes(iv), ct: b64FromBytes(ct) };
}
async function decryptJSON(key, ivB64, ctB64){
  const iv = bytesFromB64(ivB64);
  const ct = bytesFromB64(ctB64);
  const buf = await crypto.subtle.decrypt({name:'AES-GCM', iv}, key, ct);
  return JSON.parse(new TextDecoder().decode(buf));
}
function hasCrypto(){ return !!(window.crypto && window.crypto.subtle); }

async function fetchAccount(username){
  const res = await fetch(`${API_BASE}/finance?user=${encodeURIComponent(username)}`);
  if(res.status === 404) return null;
  if(!res.ok) throw new Error('network');
  return res.json();
}
async function pushAccount(payload){
  const res = await fetch(`${API_BASE}/finance`, {
    method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload)
  });
  if(!res.ok) throw new Error('network');
  return res.json();
}

function renderLoginForm(){
  coverSub.textContent = 'войди или создай';
  pinPanel.style.display = 'flex';
  const savedUser = localStorage.getItem('finance_username') || '';
  pinPanel.innerHTML = `
    <input class="pin-input" type="text" autocapitalize="off" autocorrect="off" maxlength="30" id="loginUser" placeholder="логин" value="${savedUser}">
    <input class="pin-input" type="password" inputmode="text" maxlength="20" id="loginPin" placeholder="PIN">
    <button class="pin-btn" id="loginBtn">Войти</button>
    <p class="pin-error" id="pinErr"></p>
    <p class="pin-hint">Если такого логина ещё нет — предложим создать новый.</p>
  `;
  const tryLogin = async ()=>{
    const user = document.getElementById('loginUser').value.trim().toLowerCase();
    const pin = document.getElementById('loginPin').value.trim();
    const err = document.getElementById('pinErr');
    err.textContent = '';
    if(!user){ err.textContent = 'Введи логин'; return; }
    if(pin.length < 4){ err.textContent = 'PIN — минимум 4 символа'; return; }
    err.textContent = 'Проверяю…';
    try{
      const account = await fetchAccount(user);
      if(account === null){ renderConfirmCreate(user, pin); return; }
      const salt = bytesFromB64(account.salt);
      const key = await deriveKey(pin, salt);
      await decryptJSON(key, account.checkIv, account.checkCt);
      const data = await decryptJSON(key, account.dataIv, account.dataCt);
      cryptoKey = key; currentUsername = user; currentSalt = salt;
      transactions = data.transactions || [];
      localStorage.setItem('finance_username', user);
      openBook();
    }catch(e){
      err.textContent = e.message === 'network' ? 'Нет связи с сервером' : 'Неверный PIN';
    }
  };
  document.getElementById('loginBtn').addEventListener('click', tryLogin);
  pinPanel.querySelectorAll('.pin-input').forEach(inp=>{
    inp.addEventListener('keydown', e=>{ if(e.key==='Enter') tryLogin(); });
  });
}

function renderConfirmCreate(user, pin){
  coverSub.textContent = 'такого логина ещё нет';
  pinPanel.innerHTML = `
    <p class="pin-hint">Логин «${escapeHtml(user)}» свободен — создадим новый. Введи PIN ещё раз.</p>
    <input class="pin-input" type="password" maxlength="20" id="pinConfirm" placeholder="повтори PIN">
    <button class="pin-btn" id="confirmBtn">Создать</button>
    <button class="pin-link" id="backBtn">Назад</button>
    <p class="pin-error" id="pinErr"></p>
  `;
  document.getElementById('confirmBtn').addEventListener('click', async ()=>{
    const err = document.getElementById('pinErr');
    const pin2 = document.getElementById('pinConfirm').value.trim();
    if(pin2 !== pin){ err.textContent = 'PIN не совпадает'; return; }
    err.textContent = 'Создаю…';
    try{
      const salt = crypto.getRandomValues(new Uint8Array(16));
      const key = await deriveKey(pin, salt);
      const check = await encryptJSON(key, {ok:true});
      const data = await encryptJSON(key, {transactions:[]});
      await pushAccount({
        user, salt: b64FromBytes(salt),
        checkIv: check.iv, checkCt: check.ct, dataIv: data.iv, dataCt: data.ct
      });
      cryptoKey = key; currentUsername = user; currentSalt = salt; transactions = [];
      localStorage.setItem('finance_username', user);
      openBook();
    }catch(e){
      err.textContent = 'Нет связи с сервером, попробуй снова.';
    }
  });
  document.getElementById('backBtn').addEventListener('click', renderLoginForm);
}

coverClick.addEventListener('click', ()=>{
  if(pinPanel.style.display === 'flex') return;
  if(!hasCrypto()){
    coverSub.textContent = 'браузер не поддерживает защищённое хранение';
    return;
  }
  renderLoginForm();
});

function openBook(){
  bookClosed.classList.add('hidden');
  bookOpen.classList.add('visible');
  leftTab = 'list'; monthOffset = 0; editingId = null; formType = 'expense';
  renderAll();
}
closeTab.addEventListener('click', ()=>{
  bookOpen.classList.remove('visible');
  bookClosed.classList.remove('hidden');
  pinPanel.style.display = 'none'; pinPanel.innerHTML = '';
  coverSub.textContent = 'доходы и расходы';
  cryptoKey=null; transactions=[]; currentUsername=''; currentSalt=null;
});

async function saveTransactions(){
  const check = await encryptJSON(cryptoKey, {ok:true});
  const data = await encryptJSON(cryptoKey, {transactions});
  await pushAccount({
    user: currentUsername, salt: b64FromBytes(currentSalt),
    checkIv: check.iv, checkCt: check.ct, dataIv: data.iv, dataCt: data.ct
  });
}

function getMonthDate(){
  const d = new Date();
  d.setMonth(d.getMonth() + monthOffset);
  return d;
}
function monthKey(d){ return d.getFullYear() + '-' + d.getMonth(); }
function txForMonth(){
  const target = monthKey(getMonthDate());
  return transactions.filter(t => monthKey(new Date(t.date)) === target)
                      .sort((a,b)=> new Date(b.date) - new Date(a.date));
}
function monthLabel(){
  return getMonthDate().toLocaleDateString('ru-RU', { month:'long', year:'numeric' });
}

function renderLeft(){
  const tabsHtml = `
    <div class="left-tabs">
      <button class="left-tab ${leftTab==='list'?'active':''}" id="tabList">Операции</button>
      <button class="left-tab ${leftTab==='cats'?'active':''}" id="tabCats">По категориям</button>
      <button class="left-tab ${leftTab==='help'?'active':''}" id="tabHelp">Как это работает</button>
    </div>
  `;

  if(leftTab === 'help'){
    pageLeft.innerHTML = `
      ${tabsHtml}
      <h2 class="index-head">Конфиденциально</h2>
      <hr class="index-rule"/>
      <div class="help-text">
        <p><strong>Всё зашифровано.</strong> Суммы и категории шифруются в этом браузере перед отправкой на сервер — без PIN их не прочитать, в том числе и мне.</p>
        <p><strong>Вход по логину и PIN.</strong> Можно открыть с любого устройства — данные не привязаны к одному телефону.</p>
        <p><strong>Месяц за месяцем.</strong> Стрелки листают месяцы, баланс считается отдельно за каждый.</p>
        <p><strong>Категории</strong> помогают увидеть, куда уходит больше всего — вкладка «По категориям» показывает разбивку за текущий месяц.</p>
      </div>
    `;
    wireTabs();
    return;
  }

  if(leftTab === 'cats'){
    const list = txForMonth().filter(t=>t.type==='expense');
    const totals = {};
    list.forEach(t=>{ totals[t.category] = (totals[t.category]||0) + Number(t.amount); });
    const max = Math.max(1, ...Object.values(totals));
    const rows = Object.entries(totals).sort((a,b)=>b[1]-a[1]).map(([cat,sum])=>`
      <div class="cat-row">
        <div class="cat-name">${escapeHtml(cat)}</div>
        <div class="cat-bar-track"><div class="cat-bar-fill" style="width:${Math.round(sum/max*100)}%"></div></div>
        <div class="cat-amount">${fmtMoney(sum)}</div>
      </div>
    `).join('');
    pageLeft.innerHTML = `
      ${tabsHtml}
      <h2 class="index-head">По категориям</h2>
      <p style="border:none;color:var(--ink-soft);font-family:'Caveat',cursive;font-size:15px;margin:0 0 14px;">${monthLabel()}, только расходы</p>
      ${Object.keys(totals).length ? rows : '<p class="empty-index">Нет расходов за этот месяц.</p>'}
    `;
    wireTabs();
    return;
  }

  const list = txForMonth();
  const income = list.filter(t=>t.type==='income').reduce((s,t)=>s+Number(t.amount),0);
  const expense = list.filter(t=>t.type==='expense').reduce((s,t)=>s+Number(t.amount),0);
  const balance = income - expense;

  const itemsHtml = list.length === 0
    ? `<p class="empty-index">Нет операций за этот месяц.</p>`
    : list.map(t=>{
        const d = new Date(t.date).toLocaleDateString('ru-RU', { day:'numeric', month:'short' });
        const sign = t.type === 'income' ? '+' : '−';
        return `<div class="tx-item" data-id="${t.id}">
          <div class="tx-left">
            <div class="tx-cat">${escapeHtml(t.category)}</div>
            ${t.note ? `<div class="tx-note">${escapeHtml(t.note)}</div>` : ''}
            <div class="tx-date">${d}</div>
          </div>
          <div class="tx-amount ${t.type}">${sign}${fmtMoney(t.amount)}</div>
        </div>`;
      }).join('');

  pageLeft.innerHTML = `
    ${tabsHtml}
    <div class="month-nav">
      <button class="month-arrow" id="prevMonth">‹</button>
      <span class="month-label">${monthLabel()}</span>
      <button class="month-arrow" id="nextMonth">›</button>
    </div>
    <div class="summary-card">
      <div class="summary-item"><div class="summary-label">Доходы</div><div class="summary-value income">${fmtMoney(income)}</div></div>
      <div class="summary-item"><div class="summary-label">Расходы</div><div class="summary-value expense">${fmtMoney(expense)}</div></div>
      <div class="summary-item"><div class="summary-label">Баланс</div><div class="summary-value" style="color:${balance>=0?'var(--green)':'var(--burgundy)'}">${fmtMoney(balance)}</div></div>
    </div>
    ${itemsHtml}
    <button class="new-entry-btn" id="newTxBtn">+ Новая операция</button>
    <div class="side-links">
      <button class="side-link" id="logoutBtn">Выйти из аккаунта</button>
    </div>
    <p class="storage-note">Вход по логину «${escapeHtml(currentUsername)}». Все суммы шифруются перед отправкой на сервер.</p>
  `;
  wireTabs();
  document.getElementById('prevMonth').addEventListener('click', ()=>{ monthOffset--; renderLeft(); });
  document.getElementById('nextMonth').addEventListener('click', ()=>{ monthOffset++; renderLeft(); });
  document.getElementById('newTxBtn').addEventListener('click', ()=>{ editingId=null; formType='expense'; renderRight(); });
  document.getElementById('logoutBtn').addEventListener('click', ()=>{
    if(!confirm('Выйти? Данные останутся на сервере, войти снова можно тем же логином и PIN.')) return;
    closeTab.click();
  });
  pageLeft.querySelectorAll('.tx-item').forEach(el=>{
    el.addEventListener('click', ()=>{ editingId = el.dataset.id; renderRight(); });
  });
}

function wireTabs(){
  document.getElementById('tabList').addEventListener('click', ()=>{ leftTab='list'; renderLeft(); });
  document.getElementById('tabCats').addEventListener('click', ()=>{ leftTab='cats'; renderLeft(); });
  document.getElementById('tabHelp').addEventListener('click', ()=>{ leftTab='help'; renderLeft(); });
}

function renderRight(){
  const editing = editingId ? transactions.find(t=>t.id===editingId) : null;
  if(editing) formType = editing.type;
  const cats = formType === 'income' ? INCOME_CATS : EXPENSE_CATS;
  const today = new Date().toISOString().slice(0,10);

  pageRight.innerHTML = `
    <div class="rpage-inner">
      <p class="rtitle">${editing ? 'Изменить операцию' : 'Новая операция'}</p>
      <div class="type-toggle">
        <button class="type-btn expense ${formType==='expense'?'active expense':''}" id="btnExpense">Расход</button>
        <button class="type-btn income ${formType==='income'?'active income':''}" id="btnIncome">Доход</button>
      </div>
      <p class="field-label">Сумма</p>
      <input class="field-input" id="fAmount" type="number" inputmode="decimal" value="${editing ? editing.amount : ''}" placeholder="0">
      <p class="field-label">Категория</p>
      <input class="field-input" id="fCategory" list="catList" value="${editing ? escapeHtml(editing.category) : ''}" placeholder="выбери или впиши свою">
      <datalist id="catList">${cats.map(c=>`<option value="${c}">`).join('')}</datalist>
      <p class="field-label">Дата</p>
      <input class="field-input" id="fDate" type="date" value="${editing ? editing.date.slice(0,10) : today}">
      <p class="field-label">Заметка (необязательно)</p>
      <input class="field-input" id="fNote" value="${editing ? escapeHtml(editing.note||'') : ''}" placeholder="детали">
      <div class="rpage-actions">
        <button class="act-btn primary" id="saveTxBtn">${editing ? 'Сохранить' : 'Добавить'}</button>
        ${editing ? `<button class="act-btn" id="delTxBtn">Удалить</button>` : ''}
      </div>
    </div>
  `;
  document.getElementById('btnExpense').addEventListener('click', ()=>{ formType='expense'; renderRight(); });
  document.getElementById('btnIncome').addEventListener('click', ()=>{ formType='income'; renderRight(); });
  document.getElementById('saveTxBtn').addEventListener('click', async ()=>{
    const amount = parseFloat(document.getElementById('fAmount').value);
    const category = document.getElementById('fCategory').value.trim();
    const date = document.getElementById('fDate').value || today;
    const note = document.getElementById('fNote').value.trim();
    if(!amount || amount <= 0 || !category) return;
    if(editing){
      editing.type = formType; editing.amount = amount; editing.category = category;
      editing.date = new Date(date).toISOString(); editing.note = note;
    } else {
      transactions.push({ id: uid(), type: formType, amount, category, date: new Date(date).toISOString(), note });
    }
    await saveTransactions();
    editingId = null;
    renderAll();
  });
  if(editing){
    document.getElementById('delTxBtn').addEventListener('click', async ()=>{
      if(!confirm('Удалить эту операцию?')) return;
      transactions = transactions.filter(t=>t.id!==editingId);
      editingId = null;
      await saveTransactions();
      renderAll();
    });
  }
}

function renderAll(){ renderLeft(); renderRight(); }
</script>
</body>
</html>
