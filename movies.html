<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Узнать себя</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Caveat:wght@500;600&family=EB+Garamond:ital@0;1&display=swap');
:root{
  --leather-1:#0f2d24; --leather-2:#0a1f19; --gold:#c6a15b; --gold-dim:#9a7d43;
  --paper:#f7efd9; --ink:#2b2415; --ink-soft:#5b5138; --rule:#d9c99a; --burgundy:#7a2233; --green:#2f6b45;
}
*{box-sizing:border-box;}
body{
  margin:0; min-height:100vh; background:radial-gradient(ellipse at top, #1a2a24 0%, #0d1512 100%);
  font-family:'EB Garamond', serif; color:var(--paper); padding:20px 14px 80px;
}
.wrap{ max-width:640px; margin:0 auto; }
header{ text-align:center; margin-bottom:22px; }
h1{ font-family:'Playfair Display',serif; font-size:clamp(24px,5vw,34px); color:var(--gold); margin:0; }
.subtitle{ font-family:'Caveat',cursive; font-size:18px; color:var(--gold-dim); margin-top:4px; }

.search-row{ display:flex; gap:8px; margin-bottom:16px; }
.search-row input{
  flex:1; border:1px solid var(--gold-dim); border-radius:6px; padding:9px 12px;
  background:rgba(255,255,255,.06); color:var(--paper); font-family:'EB Garamond',serif; font-size:14.5px;
}
.search-row input::placeholder{ color:rgba(247,239,217,.4); }
.search-row input:focus{ outline:none; border-color:var(--gold); }

.fab{
  display:block; width:100%; margin-bottom:20px; padding:12px; border:none; border-radius:8px;
  background:var(--burgundy); color:#fff; font-family:'EB Garamond',serif; font-size:15.5px; cursor:pointer;
}
.fab:hover{ filter:brightness(1.1); }

.title-card{
  background:rgba(255,255,255,.04); border:1px solid rgba(198,161,91,.25); border-radius:8px;
  padding:14px 16px; margin-bottom:10px; cursor:pointer;
}
.title-card:hover{ border-color:var(--gold-dim); }
.title-name{ font-family:'Playfair Display',serif; font-size:17px; color:var(--paper); }
.title-meta{ font-size:12.5px; color:var(--gold-dim); margin-top:3px; }
.title-emotions{ margin-top:6px; display:flex; flex-wrap:wrap; gap:5px; }
.chip{
  font-size:11px; padding:2px 8px; border-radius:10px; border:1px solid var(--gold-dim);
  color:var(--gold); background:rgba(198,161,91,.1);
}
.empty{ text-align:center; color:var(--gold-dim); font-style:italic; margin-top:40px; }

.back-btn{ background:none; border:none; color:var(--gold-dim); font-size:14px; cursor:pointer; margin-bottom:14px; text-decoration:underline; }
.detail-title{ font-family:'Playfair Display',serif; font-size:24px; color:var(--gold); margin:0 0 4px; }
.detail-type{ font-size:13px; color:var(--gold-dim); margin-bottom:18px; }

.entry-card{
  background:rgba(255,255,255,.04); border:1px solid rgba(198,161,91,.2); border-radius:8px;
  padding:14px 16px; margin-bottom:14px;
}
.entry-head{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px; }
.entry-author{ font-family:'Playfair Display',serif; font-size:14.5px; color:var(--gold); }
.entry-date{ font-size:11.5px; color:var(--gold-dim); }
.entry-emotions{ display:flex; flex-wrap:wrap; gap:5px; margin-bottom:8px; }
.entry-text{ font-size:15.5px; line-height:1.5; color:var(--paper); white-space:pre-wrap; }
.entry-actions{ margin-top:8px; display:flex; gap:12px; }
.entry-actions button{
  background:none; border:none; color:var(--gold-dim); font-size:12.5px; text-decoration:underline; cursor:pointer; padding:0;
}

.comments-block{ margin-top:10px; padding-top:10px; border-top:1px dashed rgba(198,161,91,.25); }
.comment-item{ margin-bottom:8px; font-size:14px; }
.comment-author{ color:var(--gold); font-weight:600; }
.comment-text{ color:var(--paper); }
.comment-del{ background:none;border:none;color:var(--gold-dim);font-size:11px;text-decoration:underline;cursor:pointer;margin-left:6px; }
.comment-add{ display:flex; gap:6px; margin-top:8px; }
.comment-add input{
  flex:1; border:1px solid rgba(198,161,91,.3); border-radius:5px; padding:6px 9px;
  background:rgba(255,255,255,.05); color:var(--paper); font-family:'EB Garamond',serif; font-size:13.5px;
}
.comment-add button{
  border:1px solid var(--gold-dim); background:transparent; color:var(--gold); border-radius:5px;
  padding:0 12px; cursor:pointer; font-family:'EB Garamond',serif;
}
.toggle-comments{ background:none; border:none; color:var(--gold-dim); font-size:12.5px; cursor:pointer; text-decoration:underline; padding:0; margin-top:6px; }

.modal{ display:none; position:fixed; inset:0; background:rgba(0,0,0,.85); z-index:50; align-items:center; justify-content:center; padding:16px; overflow-y:auto; }
.modal.open{ display:flex; }
.modal-box{ background:var(--paper); color:var(--ink); border-radius:10px; padding:24px; max-width:440px; width:100%; }
.modal-box h2{ font-family:'Playfair Display',serif; font-size:19px; margin:0 0 14px; }
.field-label{ font-size:12.5px; color:var(--ink-soft); margin:12px 0 3px; }
.field-input{
  width:100%; border:1px solid var(--rule); border-radius:5px; padding:8px 10px;
  font-family:'EB Garamond',serif; font-size:14.5px; color:var(--ink); background:#fff;
}
.field-input:focus{ outline:none; border-color:var(--gold-dim); }
textarea.field-input{ min-height:90px; resize:vertical; }
.chip-picker{ display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
.chip-option{
  font-size:12.5px; padding:5px 11px; border-radius:12px; border:1px solid var(--rule);
  background:#fff; color:var(--ink-soft); cursor:pointer;
}
.chip-option.selected{ border-color:var(--burgundy); background:rgba(122,34,51,.1); color:var(--burgundy); }
.modal-actions{ display:flex; gap:10px; margin-top:18px; }
.modal-actions button{
  flex:1; padding:10px; border-radius:6px; border:none; font-family:'EB Garamond',serif; font-size:15px; cursor:pointer;
}
.btn-primary{ background:var(--burgundy); color:#fff; }
.btn-secondary{ background:transparent; border:1px solid var(--rule) !important; color:var(--ink-soft); }
.modal-close{ float:right; background:none; border:none; font-size:22px; color:var(--ink-soft); cursor:pointer; }
.nick-row{ display:flex; gap:8px; }
.nick-row .field-input{ flex:1; }
.status{ font-size:13px; margin-top:8px; min-height:16px; }
.status.err{ color:#b23a3a; }
.status.ok{ color:#2f6b45; }
.whoami{ font-size:11.5px; color:var(--ink-soft); margin-top:4px; }
.whoami button{ background:none;border:none;color:var(--burgundy);text-decoration:underline;cursor:pointer;font-size:11.5px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Узнать себя</h1>
    <p class="subtitle">фильмы и книги, которые заставляют тебя узнать себя</p>
  </header>

  <div class="search-row">
    <input type="text" id="searchInput" placeholder="Поиск по названию…">
  </div>
  <button class="fab" id="openAddBtn">+ Поделиться впечатлением</button>

  <div id="content"></div>
</div>

<div class="modal" id="addModal">
  <div class="modal-box">
    <button class="modal-close" id="closeAdd">×</button>
    <h2>Поделиться впечатлением</h2>

    <p class="field-label">Название</p>
    <input class="field-input" id="fTitle" placeholder="Название фильма или книги" list="titleList">
    <datalist id="titleList"></datalist>

    <p class="field-label">Тип</p>
    <select class="field-input" id="fType">
      <option value="фильм">Фильм</option>
      <option value="сериал">Сериал</option>
      <option value="книга">Книга</option>
      <option value="подкаст">Подкаст</option>
    </select>

    <p class="field-label">Что почувствовала (можно несколько)</p>
    <div class="chip-picker" id="emotionPicker"></div>

    <p class="field-label">Что это всколыхнуло</p>
    <textarea class="field-input" id="fText" placeholder="Не рецензия — что это всколыхнуло, о чём подумала про себя"></textarea>

    <p class="field-label">Твой ник и PIN (чтобы только ты могла это отредактировать/удалить)</p>
    <div class="nick-row">
      <input class="field-input" id="fNick" placeholder="ник">
      <input class="field-input" id="fPin" type="password" placeholder="PIN">
    </div>
    <p class="whoami" id="whoamiNote"></p>

    <div class="modal-actions">
      <button class="btn-primary" id="submitEntryBtn">Опубликовать</button>
      <button class="btn-secondary" id="cancelAddBtn">Отмена</button>
    </div>
    <p class="status" id="addStatus"></p>
  </div>
</div>

<script>
const API_BASE = 'https://movies-sync.zimasps.workers.dev';
const EMOTIONS = ['Трогательно','Узнала себя','Разозлило','Стало легче дышать','Тревожно','Вдохновило','Смешно','Растрогало до слёз','Задело за живое','Не отпускает'];

let entries = [];
let view = 'feed';
let currentTitle = null;
let selectedEmotions = [];
let commentsCache = {};
let openComments = {};

const content = document.getElementById('content');
const addModal = document.getElementById('addModal');
const searchInput = document.getElementById('searchInput');

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function levenshtein(a, b){
  const m = a.length, n = b.length;
  const dp = Array.from({length:m+1}, (_,i)=>[i, ...Array(n).fill(0)]);
  for(let j=0;j<=n;j++) dp[0][j] = j;
  for(let i=1;i<=m;i++){
    for(let j=1;j<=n;j++){
      dp[i][j] = a[i-1]===b[j-1] ? dp[i-1][j-1] : 1 + Math.min(dp[i-1][j-1], dp[i-1][j], dp[i][j-1]);
    }
  }
  return dp[m][n];
}
function findSimilarTitle(newTitle){
  const norm = newTitle.trim().toLowerCase();
  const existing = [...new Set(entries.map(e=>e.title))];
  for(const t of existing){
    const tNorm = t.trim().toLowerCase();
    if(tNorm === norm) return null; // точное совпадение — это и так сольётся, не нужно спрашивать
    const contains = tNorm.includes(norm) || norm.includes(tNorm);
    const dist = levenshtein(norm, tNorm);
    const closeEnough = dist <= Math.max(2, Math.floor(Math.min(norm.length, tNorm.length) * 0.2));
    if(contains || closeEnough) return t;
  }
  return null;
}
function fmtDate(ts){
  return new Date(ts).toLocaleDateString('ru-RU', { day:'numeric', month:'short', year:'numeric' });
}
function getSavedId(){
  return { nick: localStorage.getItem('feed_nick')||'', pin: localStorage.getItem('feed_pin')||'' };
}
function saveId(nick, pin){
  localStorage.setItem('feed_nick', nick);
  localStorage.setItem('feed_pin', pin);
}

async function loadEntries(){
  const res = await fetch(`${API_BASE}/entries`);
  const data = await res.json();
  entries = data.entries || [];
}
async function loadComments(entryId){
  const res = await fetch(`${API_BASE}/comments?entryId=${encodeURIComponent(entryId)}`);
  const data = await res.json();
  commentsCache[entryId] = data.comments || [];
}

function groupByTitle(list){
  const groups = {};
  list.forEach(e=>{
    const key = e.title.trim().toLowerCase();
    if(!groups[key]) groups[key] = { title: e.title, type: e.type, entries: [] };
    groups[key].entries.push(e);
  });
  return Object.values(groups).sort((a,b)=>{
    const aLast = Math.max(...a.entries.map(e=>e.createdAt));
    const bLast = Math.max(...b.entries.map(e=>e.createdAt));
    return bLast - aLast;
  });
}

function renderFeed(){
  const q = searchInput.value.trim().toLowerCase();
  const groups = groupByTitle(entries).filter(g => !q || g.title.toLowerCase().includes(q));
  if(groups.length === 0){
    content.innerHTML = `<p class="empty">Пока пусто — стань первой, кто поделится впечатлением.</p>`;
    return;
  }
  content.innerHTML = groups.map(g=>{
    const allEmotions = [...new Set(g.entries.flatMap(e=>e.emotions||[]))].slice(0,4);
    return `<div class="title-card" data-title="${escapeHtml(g.title)}">
      <div class="title-name">${escapeHtml(g.title)}</div>
      <div class="title-meta">${g.type} · ${g.entries.length} ${g.entries.length===1?'впечатление':'впечатлений'}</div>
      <div class="title-emotions">${allEmotions.map(e=>`<span class="chip">${escapeHtml(e)}</span>`).join('')}</div>
    </div>`;
  }).join('');
  content.querySelectorAll('.title-card').forEach(el=>{
    el.addEventListener('click', ()=>{ currentTitle = el.dataset.title; view='title'; renderAll(); });
  });
}

async function renderTitleView(){
  const list = entries.filter(e=>e.title.trim().toLowerCase() === currentTitle.trim().toLowerCase())
                       .sort((a,b)=>b.createdAt - a.createdAt);
  content.innerHTML = `<button class="back-btn" id="backBtn">← Ко всем впечатлениям</button>
    <h2 class="detail-title">${escapeHtml(currentTitle)}</h2>
    <p class="detail-type">${list[0] ? list[0].type : ''} · ${list.length} ${list.length===1?'впечатление':'впечатлений'}</p>
    <div id="entriesBlock">Загружаю…</div>`;
  document.getElementById('backBtn').addEventListener('click', ()=>{ view='feed'; renderAll(); });

  const me = getSavedId();
  const entriesBlock = document.getElementById('entriesBlock');
  let html = '';
  for(const e of list){
    if(!(e.id in commentsCache)) await loadComments(e.id);
    const comments = commentsCache[e.id] || [];
    const isMine = me.nick && me.pin;
    const commentsOpen = openComments[e.id];
    html += `<div class="entry-card" data-id="${e.id}">
      <div class="entry-head">
        <span class="entry-author">${escapeHtml(e.author)}</span>
        <span class="entry-date">${fmtDate(e.createdAt)}</span>
      </div>
      <div class="entry-emotions">${(e.emotions||[]).map(em=>`<span class="chip">${escapeHtml(em)}</span>`).join('')}</div>
      <div class="entry-text">${escapeHtml(e.text)}</div>
      <div class="entry-actions">
        <button class="del-entry" data-id="${e.id}">Удалить</button>
        <button class="toggle-comments" data-id="${e.id}">${commentsOpen ? 'Скрыть комментарии' : `Комментарии (${comments.length})`}</button>
      </div>
      ${commentsOpen ? `
        <div class="comments-block">
          ${comments.map(c=>`<div class="comment-item" data-cid="${c.id}">
            <span class="comment-author">${escapeHtml(c.author)}:</span>
            <span class="comment-text">${escapeHtml(c.text)}</span>
            <button class="comment-del" data-entry="${e.id}" data-id="${c.id}">×</button>
          </div>`).join('') || '<p style="color:var(--gold-dim);font-size:13px;">Пока нет комментариев.</p>'}
          <div class="comment-add">
            <input type="text" placeholder="ник" class="c-nick" value="${escapeHtml(me.nick)}">
            <input type="password" placeholder="PIN" class="c-pin" value="${escapeHtml(me.pin)}" style="max-width:70px;">
            <input type="text" placeholder="Написать комментарий…" class="c-text" data-entry="${e.id}">
            <button class="c-send" data-entry="${e.id}">→</button>
          </div>
        </div>
      ` : ''}
    </div>`;
  }
  entriesBlock.innerHTML = html;
  wireEntryActions();
}

function wireEntryActions(){
  document.querySelectorAll('.toggle-comments').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      openComments[btn.dataset.id] = !openComments[btn.dataset.id];
      renderTitleView();
    });
  });
  document.querySelectorAll('.del-entry').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const me = getSavedId();
      if(!me.nick || !me.pin){ alert('Введи ник и PIN хотя бы раз через форму "Поделиться", чтобы удалять свои записи.'); return; }
      if(!confirm('Удалить это впечатление?')) return;
      const res = await fetch(`${API_BASE}/entries/delete`, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ id: btn.dataset.id, nick: me.nick, pin: me.pin })
      });
      const data = await res.json();
      if(data.ok){ await loadEntries(); renderTitleView(); }
      else alert(data.error === 'wrong_pin' ? 'Это не твоя запись (неверный ник/PIN)' : 'Не получилось удалить');
    });
  });
  document.querySelectorAll('.comment-del').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const me = getSavedId();
      if(!me.nick || !me.pin){ alert('Нужен твой ник и PIN.'); return; }
      const res = await fetch(`${API_BASE}/comments/delete`, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ entryId: btn.dataset.entry, id: btn.dataset.id, nick: me.nick, pin: me.pin })
      });
      const data = await res.json();
      if(data.ok){ delete commentsCache[btn.dataset.entry]; renderTitleView(); }
      else alert(data.error === 'wrong_pin' ? 'Это не твой комментарий' : 'Не получилось удалить');
    });
  });
  document.querySelectorAll('.c-send').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const entryId = btn.dataset.entry;
      const card = btn.closest('.comments-block');
      const nick = card.querySelector('.c-nick').value.trim();
      const pin = card.querySelector('.c-pin').value.trim();
      const text = card.querySelector('.c-text').value.trim();
      if(!nick || !pin || !text) return;
      saveId(nick, pin);
      const res = await fetch(`${API_BASE}/comments`, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ entryId, nick, pin, text })
      });
      const data = await res.json();
      if(data.ok){ delete commentsCache[entryId]; openComments[entryId] = true; renderTitleView(); }
    });
  });
}

function renderAll(){
  if(view === 'feed') renderFeed();
  else renderTitleView();
}

searchInput.addEventListener('input', ()=>{ if(view==='feed') renderFeed(); });

// ---- модалка добавления ----
const emotionPicker = document.getElementById('emotionPicker');
emotionPicker.innerHTML = EMOTIONS.map(em=>`<span class="chip-option" data-e="${escapeHtml(em)}">${escapeHtml(em)}</span>`).join('');
emotionPicker.querySelectorAll('.chip-option').forEach(chip=>{
  chip.addEventListener('click', ()=>{
    const e = chip.dataset.e;
    if(selectedEmotions.includes(e)){
      selectedEmotions = selectedEmotions.filter(x=>x!==e);
      chip.classList.remove('selected');
    } else {
      selectedEmotions.push(e);
      chip.classList.add('selected');
    }
  });
});

document.getElementById('openAddBtn').addEventListener('click', ()=>{
  const me = getSavedId();
  document.getElementById('fNick').value = me.nick;
  document.getElementById('fPin').value = me.pin;
  document.getElementById('whoamiNote').innerHTML = me.nick ? `Запомнено: пишешь как «${escapeHtml(me.nick)}»` : '';
  const titleList = document.getElementById('titleList');
  const uniqueTitles = [...new Set(entries.map(e=>e.title))];
  titleList.innerHTML = uniqueTitles.map(t=>`<option value="${escapeHtml(t)}">`).join('');
  addModal.classList.add('open');
});
document.getElementById('closeAdd').addEventListener('click', ()=> addModal.classList.remove('open'));
document.getElementById('cancelAddBtn').addEventListener('click', ()=> addModal.classList.remove('open'));

document.getElementById('submitEntryBtn').addEventListener('click', async ()=>{
  const title = document.getElementById('fTitle').value.trim();
  const type = document.getElementById('fType').value;
  const text = document.getElementById('fText').value.trim();
  const nick = document.getElementById('fNick').value.trim();
  const pin = document.getElementById('fPin').value.trim();
  const status = document.getElementById('addStatus');
  status.textContent = ''; status.className = 'status';
  if(!title || !text || !nick || !pin){ status.textContent = 'Заполни название, впечатление, ник и PIN'; status.className='status err'; return; }

  const similar = findSimilarTitle(title);
  let finalTitle = title;
  if(similar){
    const useExisting = confirm(`Уже есть похожее название: «${similar}».\n\nНажми ОК, чтобы добавить твоё впечатление к нему (все отзывы будут вместе), или «Отмена», чтобы всё равно создать «${title}» отдельно.`);
    if(useExisting) finalTitle = similar;
  }

  status.textContent = 'Публикую…';
  try{
    const res = await fetch(`${API_BASE}/entries`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ title: finalTitle, type, emotions: selectedEmotions, text, nick, pin })
    });
    const data = await res.json();
    if(data.ok){
      saveId(nick, pin);
      status.textContent = 'Опубликовано!'; status.className='status ok';
      document.getElementById('fTitle').value=''; document.getElementById('fText').value='';
      selectedEmotions = [];
      emotionPicker.querySelectorAll('.chip-option').forEach(c=>c.classList.remove('selected'));
      await loadEntries();
      setTimeout(()=>{ addModal.classList.remove('open'); currentTitle = finalTitle; view='title'; renderAll(); }, 600);
    } else {
      status.textContent = 'Не получилось опубликовать'; status.className='status err';
    }
  }catch(e){
    status.textContent = 'Нет связи с сервером'; status.className='status err';
  }
});

(async function init(){
  await loadEntries();
  renderAll();
})();
</script>
</body>
</html>
